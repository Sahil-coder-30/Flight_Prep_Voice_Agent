apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-deployment
  labels:
    app: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
    spec:
      containers:
      - name: ai-container
        image: ai-service
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "250m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 5
        ports:
        - containerPort: 3000
          name: ai-http
        env:
        - name: PORT
          value: "3000"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: database
              key: AI
        - name: REDIS_URI
          valueFrom:
            secretKeyRef:
              name: database
              key: REDIS_URI
        - name: AUTH_JWKS_URI
          value: "http://auth-service/api/auth/.well-known/jwks.json"
        - name: BACKEND_SERVICE_URL
          value: "http://backend-service"
        - name: MISTRALAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-secret
              key: MISTRALAI_API_KEY
              optional: true
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-secret
              key: GOOGLE_API_KEY
              optional: true
        - name: RIME_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-secret
              key: RIME_API_KEY
              optional: true
        - name: QDRANT_URL
          valueFrom:
            secretKeyRef:
              name: ai-secret
              key: QDRANT_URL
              optional: true
